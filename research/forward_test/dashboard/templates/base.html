<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{% block title %}Forward Test Dashboard{% endblock %}</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8eb; --muted: #8b93a1;
    --green: #4ade80; --red: #f87171; --amber: #fbbf24; --blue: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 24px 32px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; color: var(--muted); margin: 24px 0 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  nav { margin-bottom: 20px; }
  nav a { color: var(--blue); text-decoration: none; margin-right: 16px; font-size: 14px; }
  nav a:hover { text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-survivor { background: #1e3a2f; color: var(--green); }
  .badge-reject { background: #2a2440; color: #c084fc; }
  .stat { display: inline-block; margin-right: 28px; }
  .stat .n { font-size: 22px; font-weight: 700; display: block; }
  .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  button, .btn { background: var(--blue); color: #0f1115; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button.confirm { background: var(--green); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  textarea { width: 100%; min-height: 120px; background: #0b0d11; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: monospace; font-size: 12px; }
  .warn { color: var(--amber); font-size: 13px; }
  .muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<nav><a href="/">Positions</a><a href="/build">Build &amp; Log</a></nav>
{% block content %}{% endblock %}
</body>
</html>
